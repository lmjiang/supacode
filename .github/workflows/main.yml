name: adhoc

on:
  workflow_dispatch: {}

concurrency:
  group: adhoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
    env:
      MISE_HTTP_TIMEOUT: 120
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-macos
        with:
          disable-tools: spm:swiftlang/swift-format,npm:create-dmg

      - name: Generate project
        run: make generate-project

      - name: Build release app with ad-hoc signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace supacode.xcworkspace \
            -scheme supacode \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -skipMacroValidation \
            build

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail
          settings="$(xcodebuild \
            -workspace supacode.xcworkspace \
            -scheme supacode \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            -showBuildSettings \
            -json)"
          build_dir="$(echo "$settings" | jq -r '.[0].buildSettings.BUILT_PRODUCTS_DIR')"
          product="$(echo "$settings" | jq -r '.[0].buildSettings.FULL_PRODUCT_NAME')"
          app_path="$build_dir/$product"
          test -d "$app_path"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        run: |
          set -euo pipefail
          app_path="${{ steps.app.outputs.app_path }}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -d --entitlements - "$app_path" || true

      - name: Package artifacts
        run: |
          set -euo pipefail
          app_path="${{ steps.app.outputs.app_path }}"
          mkdir -p build/adhoc
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/adhoc/supacode-adhoc.app.zip
          hdiutil create \
            -volname "Supacode Adhoc" \
            -srcfolder "$app_path" \
            -ov \
            -format UDZO \
            build/adhoc/supacode-adhoc.dmg
          shasum -a 256 build/adhoc/supacode-adhoc.app.zip build/adhoc/supacode-adhoc.dmg \
            > build/adhoc/checksums.txt

      - uses: actions/upload-artifact@v6
        with:
          name: supacode-adhoc-${{ github.sha }}
          path: |
            build/adhoc/supacode-adhoc.app.zip
            build/adhoc/supacode-adhoc.dmg
            build/adhoc/checksums.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="adhoc-${GITHUB_RUN_NUMBER}-${short_sha}"
          notes="Ad-hoc Supacode build for ${GITHUB_SHA}. This build is not notarized."
          gh release create "$tag" \
            build/adhoc/supacode-adhoc.app.zip \
            build/adhoc/supacode-adhoc.dmg \
            build/adhoc/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Supacode ad-hoc ${short_sha}" \
            --notes "$notes" \
            --prerelease
