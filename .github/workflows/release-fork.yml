# Self-use fork release: ad-hoc signed (no Apple Developer ID, no notarization,
# no Sparkle, no telemetry), published to THIS fork's Releases. Trigger manually
# after syncing an upstream release tag into fork main. Deliberately standalone —
# it touches none of upstream's workflows/Makefile, so `git merge` of upstream
# never conflicts here.
name: Release (fork ad-hoc)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank → v<MARKETING_VERSION>-pollfix.<run#>)"
        required: false
        type: string
  # The sync routine's merge commit carries the "[release]" marker → auto-package.
  # Ordinary pushes to main have no marker, so day-to-day commits never build.
  # The patch branch always packages so a self-use binary can be produced
  # without merging the fork branch back to main first.
  push:
    branches:
      - main
      - joker47/v0.10.5-disable-line-change-polling

concurrency:
  group: release-fork
  cancel-in-progress: false

jobs:
  build:
    # Always on manual dispatch; on push only when the commit is marked (the
    # routine's "sync: upstream <tag> [release]" merge), so normal pushes skip.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/joker47/v0.10.5-disable-line-change-polling' ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: macos-26
    permissions:
      contents: write # create the release on this fork
    env:
      MISE_HTTP_TIMEOUT: "120"
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-macos
        with:
          authenticate-tuist: "false"

      # Blank telemetry so the SDKs never initialize (AppTelemetry/AppCrashReporting
      # bail on an empty DSN/API key), regardless of the in-app settings toggle.
      - name: Strip telemetry from the build
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/ForkOverrides.xcconfig <<'EOF'
          SENTRY_DSN =
          POSTHOG_API_KEY =
          POSTHOG_HOST =
          EOF
          echo "XCODE_XCCONFIG_FILE=$PWD/build/ForkOverrides.xcconfig" >> "$GITHUB_ENV"

      # Release-configured project, no Tuist Cloud binary cache (fork has no access
      # to upstream's `fullHandle`); `--cache-profile none` mirrors `make archive`.
      - name: Generate Xcode project (Release)
        run: |
          mise exec -- tuist install --force-resolved-versions
          mise exec -- tuist generate --no-open --cache-profile none --configuration Release

      # Ad-hoc signature ("-"): runs on any Mac after clearing the quarantine
      # attribute; no Developer ID / notarization needed.
      - name: Archive (ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace supacode.xcworkspace \
            -scheme supacode \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/supacode.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            -skipMacroValidation \
            2>&1 | mise exec -- xcbeautify --quiet --disable-logging

      - name: Package .app → zip
        run: |
          set -euo pipefail
          APP="$(find build/supacode.xcarchive/Products/Applications -maxdepth 1 -name 'supacode.app' -print -quit)"
          [ -n "$APP" ] || { echo "::error::supacode.app not found in archive"; exit 1; }
          cat > build/ForkAdHoc.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.automation.apple-events</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.device.audio-input</key>
            <true/>
            <key>com.apple.security.device.camera</key>
            <true/>
            <key>com.apple.security.personal-information.addressbook</key>
            <true/>
            <key>com.apple.security.personal-information.calendars</key>
            <true/>
            <key>com.apple.security.personal-information.location</key>
            <true/>
            <key>com.apple.security.personal-information.photos-library</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --sign - --options runtime --entitlements build/ForkAdHoc.entitlements "$APP"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/supacode.app.zip

      - name: Create GitHub Release (this fork)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="v${VERSION}-pollfix.${{ github.run_number }}"
          cat > build/notes.md <<'EOF'
          Ad-hoc (unsigned, un-notarized) self-use fork build.

          This build disables automatic line-change polling by default.

          First launch is blocked by Gatekeeper. To open:

          ```
          xattr -dr com.apple.quarantine /Applications/supacode.app
          ```

          or right-click the app → Open. No telemetry is bundled (Sentry/PostHog disabled at build time).
          EOF
          gh release create "$TAG" build/supacode.app.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file build/notes.md
